name: Build & Deploy Cineby

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Generate build-time environment
        run: |
          cat << 'EOF' > .env.production
          NEXT_PUBLIC_SITE_URL=https://cineby.group
          NEXT_PUBLIC_CONTACT_EMAIL=contact@cineby.group
          NEXT_PUBLIC_LEGAL_CONTACT_EMAIL=maheshsharan28@gmail.com
          NEXT_PUBLIC_TMDB_DEFAULT_LANGUAGE=en
          NEXT_PUBLIC_IMAGE_PROXY_URL=https://wsrv.nl
          NEXT_PUBLIC_TMDB_IMAGE_BASE_URL=https://image.tmdb.org/t/p
          NEXT_PUBLIC_IMAGE_MODE=wsrv
          NEXT_PUBLIC_TRAILER_API_URL=https://trailers.wecollege.net/getOldestTrailer
          NEXT_PUBLIC_GOOGLE_CLIENT_ID=710500048793-55rctnc4coj15s1jvao7l2ouejvpftpn.apps.googleusercontent.com
          NEXT_PUBLIC_FLAGS_API_BASE_URL=https://flagsapi.com
          NEXT_PUBLIC_ENABLE_ANALYTICS=true
          NEXT_PUBLIC_GA_MEASUREMENT_ID=G-GWQTFJK3QW
          NEXT_PUBLIC_DEVTOOLS_GUARD_ENABLED=false
          EOF

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          secrets: |
            env=.env.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "🚀 Starting Cineby auto-deploy..."
            cd /var/www/cineby

            # Pull latest git changes (for compose and config files)
            git fetch origin main
            git reset --hard origin/main

            # Pull pre-built image from ghcr.io
            IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"
            docker pull "$IMAGE"

            # Recreate containers with new image
            docker compose up -d cineby-web

            # Ensure SQLite & Redis permissions remain properly set
            sudo chown -R 1001:1000 /var/www/cineby/data
            sudo chmod 770 /var/www/cineby/data
            sudo chown -R 999:999 /var/www/cineby/data/redis

            # Clean up old images to preserve VPS disk space
            docker image prune -f

            echo "✅ Cineby deployment successful!"
